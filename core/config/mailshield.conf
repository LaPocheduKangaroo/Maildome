# MailShield Basic — configuration file
# All values shown are defaults.
# Lines starting with # are comments.

[acquisition]
# How MailShield receives email copies.
# Options: imap | milter | journal
mode = imap

# IMAP settings (used when mode = imap)
imap_host = mail.example.com
imap_port = 993
imap_use_ssl = true
imap_user = scanner@example.com
# imap_password set via environment variable IMAP_PASSWORD
imap_mailbox = INBOX

# IMAP IDLE push mode. Falls back to poll if connection drops.
imap_idle = true
# Poll interval in seconds (fallback when IDLE is unavailable)
imap_poll_interval = 30

# How long to remember a message hash (prevents re-scanning)
dedup_window_hours = 24

# Where to store .eml files
storage_path = /var/lib/mailshield/emails

[groups]
# Map your mail server groups to MailShield scan profiles.
# Format: group_name = profile
# Profiles: critical | high | standard | low
#
# Examples:
# executives = critical
# finance    = high
# staff      = standard
# interns    = low
#
# Default profile for users not in any listed group:
default_profile = standard

[scoring]
# Score thresholds (0–100 scale, normalized)
# Emails scoring below threshold_suspicious are CLEAN.
# Emails scoring above threshold_dangerous are DANGEROUS.
# Emails in between are SUSPICIOUS.
threshold_suspicious = 40
threshold_dangerous  = 70

# Check weights — how much each check contributes to the score.
# Higher weight = more influence on final score.
# All weights are relative to each other.
weight_spf_dkim_dmarc   = 30
weight_ip_reputation    = 25
weight_url_blacklist    = 25
weight_header_anomalies = 10
weight_typosquatting    = 10

[blacklists]
# Public blacklists enabled by default.
# Set to false to disable individual lists.
spamhaus = true
abusech  = true
openphish = true
phishtank = true

# Add custom blacklist URLs, one per line.
# custom_ip_list   = https://example.com/my-ip-blacklist.txt
# custom_url_list  = https://example.com/my-url-blacklist.txt

[notifications]
# Email address for admin alerts (degraded state, dangerous verdict)
admin_email =

# Send alert when a component fails and circuit breaker activates
degraded_alert = true

# Send alert when a DANGEROUS verdict is produced
dangerous_alert = true

[api]
host = 127.0.0.1
port = 8080

# Token expiry in minutes
token_expire_minutes = 60

[logging]
# Log level: debug | info | warning | error
level = info
path  = /var/log/mailshield/mailshield.log
