version: '3.9'

services:

  postfix:
    image: boky/postfix:latest
    container_name: mailshield_postfix
    environment:
      - ALLOWED_SENDER_DOMAINS=example.com
    ports:
      - "25:25"
    networks:
      - mailshield_net

  redis:
    image: redis:7-alpine
    container_name: mailshield_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mailshield_net

  postgres:
    image: postgres:15-alpine
    container_name: mailshield_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./core/config/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - mailshield_net

  celery_worker:
    build: .
    container_name: mailshield_worker
    command: celery -A core.engine.worker worker --loglevel=info
    environment:
      - MAILSHIELD_CONFIG=/etc/mailshield/mailshield.conf
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./:/app
      - eml_storage:/var/lib/mailshield/emails
    depends_on:
      - redis
      - postgres
    networks:
      - mailshield_net

  api:
    build: .
    container_name: mailshield_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8080
    environment:
      - MAILSHIELD_CONFIG=/etc/mailshield/mailshield.conf
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
    depends_on:
      - redis
      - postgres
    networks:
      - mailshield_net

volumes:
  redis_data:
  postgres_data:
  eml_storage:

networks:
  mailshield_net:
    driver: bridge
